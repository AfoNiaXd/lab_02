[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "Потоковый анализатор журналов событий (CSV/JSONL)"
readme = "README.md"
authors = [
    {name = "Афонин Артём", email = "afoninart2008@gmail.com"}
]
requires-python = ">=3.11"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pre-commit>=4.5.0",
    "black>=25.11.0",
    "ruff>=0.14.7",
    "mypy>=1.19.0",
]

[project.scripts]
streamstats = "streamstats.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
fix = false
target-version = "py311"
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
lines-between-types = 1
no-sections = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"